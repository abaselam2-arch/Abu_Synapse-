<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SYNAPSE AI Tutor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(0, 170, 255, 0.15), transparent 35%),
        linear-gradient(135deg, #050b14, #0b1422 50%, #07101c);
      color: #ffffff;
      min-height: 100vh;
    }

    header {
      padding: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #42c8ff;
    }

    .back {
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,0.08);
      padding: 10px 15px;
      border-radius: 10px;
    }

    main {
      width: min(1000px, 94%);
      margin: 25px auto;
    }

    .hero {
      text-align: center;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: clamp(28px, 6vw, 48px);
      margin-bottom: 10px;
    }

    .hero p {
      color: #aebdcc;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
      padding: 8px 13px;
      border-radius: 20px;
      background: rgba(0, 255, 170, 0.08);
      color: #63f5bc;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #63f5bc;
    }

    .status.error {
      color: #ff7777;
      background: rgba(255, 70, 70, 0.1);
    }

    .status.error .status-dot {
      background: #ff5555;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .control {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.09);
      padding: 12px;
      border-radius: 12px;
    }

    label {
      display: block;
      color: #8fa3b8;
      font-size: 12px;
      margin-bottom: 7px;
    }

    select,
    textarea {
      width: 100%;
      background: #0c1827;
      color: white;
      border: 1px solid #24384e;
      border-radius: 10px;
      padding: 11px;
      outline: none;
    }

    select:focus,
    textarea:focus {
      border-color: #42c8ff;
    }

    .chat {
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 18px;
      overflow: hidden;
    }

    .messages {
      min-height: 400px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      max-width: 85%;
      margin-bottom: 14px;
      padding: 13px 15px;
      border-radius: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #075d86;
    }

    .assistant {
      margin-right: auto;
      background: #172638;
      border: 1px solid #263c52;
    }

    .input-area {
      padding: 15px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 17px;
      cursor: pointer;
      font-weight: bold;
    }

    .send {
      background: #42c8ff;
      color: #03101a;
    }

    .clear {
      background: #24384e;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .examples {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .example {
      background: rgba(255,255,255,0.07);
      color: #d8e6f2;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 11px;
      border-radius: 20px;
      font-size: 12px;
    }

    .typing {
      color: #8fa3b8;
      font-style: italic;
    }

    @media (max-width: 750px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }

      .message {
        max-width: 94%;
      }
    }

    @media (max-width: 480px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .messages {
        min-height: 350px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">SYNAPSE AI</div>

  <a class="back" href="dashboard.html">
    ← Dashboard
  </a>
</header>

<main>

  <section class="hero">
    <h1>🤖 SYNAPSE AI Tutor</h1>
    <p>Your adaptive learning assistant</p>

    <div id="status" class="status">
      <span class="status-dot"></span>
      <span id="statusText">Checking AI connection...</span>
    </div>
  </section>

  <section class="controls">

    <div class="control">
      <label>Subject</label>

      <select id="subject">
        <option>Mathematics</option>
        <option>Physics</option>
        <option>Chemistry</option>
        <option>Biology</option>
        <option selected>General</option>
      </select>
    </div>

    <div class="control">
      <label>Level</label>

      <select id="level">
        <option selected>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
      </select>
    </div>

    <div class="control">
      <label>Mode</label>

      <select id="mode">
        <option selected>Explain</option>
        <option>Hint</option>
        <option>Practice</option>
        <option>Review</option>
      </select>
    </div>

    <div class="control">
      <label>Concept</label>

      <select id="concept">
        <option>General</option>
        <option>Linear Equations</option>
        <option>Fractions</option>
        <option>Algebra</option>
        <option>Physics</option>
        <option>Chemistry</option>
        <option>Biology</option>
      </select>
    </div>

  </section>

  <div class="examples">
    <button class="example" data-question="Explain linear equations simply.">
      Linear equations
    </button>

    <button class="example" data-question="Explain Newton's first law with an example.">
      Newton's law
    </button>

    <button class="example" data-question="What is photosynthesis?">
      Photosynthesis
    </button>

    <button class="example" data-question="Help me understand fractions.">
      Fractions
    </button>
  </div>

  <section class="chat">

    <div id="messages" class="messages">

      <div class="message assistant">
        👋 Hello! I am your SYNAPSE AI Tutor.

        Ask me a question and I will help you understand it step by step.
      </div>

    </div>

    <div class="input-area">

      <textarea
        id="message"
        maxlength="2000"
        placeholder="Ask your AI tutor something..."
      ></textarea>

      <div class="actions">

        <button id="sendButton" class="send">
          Send →
        </button>

        <button id="clearButton" class="clear">
          Clear conversation
        </button>

      </div>

    </div>

  </section>

</main>

<script>
  /*
   * IMPORTANT:
   * This is the public frontend URL of your Render backend.
   * Your OpenAI API key is NOT stored here.
   */
  const API_URL =
    "https://synapse-ai-tutor-2.onrender.com/api/tutor";

  const HEALTH_URL =
    "https://synapse-ai-tutor-2.onrender.com/api/health";


  const messagesElement =
    document.getElementById("messages");

  const messageInput =
    document.getElementById("message");

  const sendButton =
    document.getElementById("sendButton");

  const clearButton =
    document.getElementById("clearButton");

  const subjectElement =
    document.getElementById("subject");

  const levelElement =
    document.getElementById("level");

  const modeElement =
    document.getElementById("mode");

  const conceptElement =
    document.getElementById("concept");

  const statusElement =
    document.getElementById("status");

  const statusText =
    document.getElementById("statusText");


  let conversationHistory = [];


  function setStatus(online, text) {

    statusText.textContent = text;

    if (online) {
      statusElement.classList.remove("error");
    } else {
      statusElement.classList.add("error");
    }
  }


  function addMessage(role, text) {

    const div =
      document.createElement("div");

    div.className =
      "message " +
      (role === "user"
        ? "user"
        : "assistant");

    div.textContent = text;

    messagesElement.appendChild(div);

    messagesElement.scrollTop =
      messagesElement.scrollHeight;

    return div;
  }


  async function checkConnection() {

    try {

      const response =
        await fetch(HEALTH_URL, {
          method: "GET",
          cache: "no-store"
        });

      if (!response.ok) {
        throw new Error(
          "Health check HTTP " +
          response.status
        );
      }

      const data =
        await response.json();

      if (data.status === "ok") {

        setStatus(
          true,
          "AI Tutor connected"
        );

        return true;
      }

      throw new Error(
        "Unexpected health response"
      );

    } catch (error) {

      console.error(
        "Health check failed:",
        error
      );

      setStatus(
        false,
        "AI Tutor connection problem"
      );

      return false;
    }
  }


  async function sendMessage() {

    const message =
      messageInput.value.trim();

    if (!message) {
      return;
    }

    sendButton.disabled = true;

    addMessage("user", message);

    messageInput.value = "";


    const typing =
      addMessage(
        "assistant",
        "SYNAPSE is thinking..."
      );

    typing.classList.add("typing");


    try {

      const payload = {

        message: message,

        subject:
          subjectElement.value,

        level:
          levelElement.value,

        mode:
          modeElement.value,

        concept:
          conceptElement.value,

        history:
          conversationHistory.slice(-8)

      };


      console.log(
        "Sending request:",
        payload
      );


      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(payload)

        });


      console.log(
        "API status:",
        response.status
      );


      let data;

      try {

        data =
          await response.json();

      } catch (jsonError) {

        throw new Error(
          "The server returned an invalid response."
        );
      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          "AI Tutor request failed. HTTP " +
          response.status
        );
      }


      if (!data.success) {

        throw new Error(
          data.error ||
          "AI Tutor returned an unsuccessful response."
        );
      }


      typing.remove();


      addMessage(
        "assistant",
        data.answer
      );


      conversationHistory.push(
        {
          role: "user",
          content: message
        },
        {
          role: "assistant",
          content: data.answer
        }
      );


      setStatus(
        true,
        "AI Tutor connected"
      );


    } catch (error) {

      console.error(
        "AI Tutor error:",
        error
      );


      typing.remove();


      addMessage(
        "assistant",
        "⚠️ " +
        error.message
      );


      setStatus(
        false,
        "AI Tutor request failed"
      );

    } finally {

      sendButton.disabled = false;

      messageInput.focus();

    }
  }


  sendButton.addEventListener(
    "click",
    sendMessage
  );


  messageInput.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  clearButton.addEventListener(
    "click",
    function() {

      conversationHistory = [];

      messagesElement.innerHTML = "";

      addMessage(
        "assistant",
        "Conversation cleared. What would you like to learn?"
      );

    }
  );


  document
    .querySelectorAll(".example")
    .forEach(function(button) {

      button.addEventListener(
        "click",
        function() {

          messageInput.value =
            button.dataset.question;

          messageInput.focus();

        }
      );

    });


  /*
   * Check the backend when the page opens.
   */
  checkConnection();

</script>

</body>
</html>
